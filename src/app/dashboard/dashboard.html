<div class="dashboard-container">
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav mode="side" opened class="sidenav">
      <div class="sidenav-header">
        <div class="logo">
          <mat-icon class="logo-icon">account_balance</mat-icon>
          <span>SAAC</span>
        </div>

        <div class="unity-info" *ngIf="usuario() as u">
          <span class="unity-name">Tesouraria</span>
          <span class="user-name">{{ u.nome }}</span>
        </div>


      </div>

      <mat-nav-list class="sidenav-nav">
        <ng-container *ngFor="let item of menuFiltrado()">
          <a
            mat-list-item
            *ngIf="!item.filhos"
            [routerLink]="item.route"
            routerLinkActive="active"
            class="nav-item">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>

          <mat-expansion-panel *ngIf="item.filhos" class="nav-group">
            <mat-expansion-panel-header>
              <mat-panel-title>
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
              </mat-panel-title>
            </mat-expansion-panel-header>

            <a
              mat-list-item
              *ngFor="let filho of item.filhos"
              [routerLink]="filho.route"
              routerLinkActive="active"
              class="nav-item sub-item">
              <mat-icon matListItemIcon>{{ filho.icon }}</mat-icon>
              <span matListItemTitle>{{ filho.label }}</span>
            </a>
          </mat-expansion-panel>
        </ng-container>
      </mat-nav-list>

      <div class="sidenav-footer">
        <button mat-button class="logout-button" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
