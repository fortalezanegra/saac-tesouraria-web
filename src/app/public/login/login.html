<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>SAAC</mat-card-title>
      <mat-card-subtitle>Sistema Administrativo ADBras Cosmópolis</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" formControlName="email" placeholder="seu@email.com">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput type="password" formControlName="senha" placeholder="Sua senha">
        </mat-form-field>

        <div *ngIf="erro" class="erro">{{ erro }}</div>

        <button
          mat-raised-button
          color="primary"
          class="full-width"
          type="submit"
          [disabled]="loginForm.invalid || carregando">

          <span *ngIf="!carregando">Entrar</span>
          <mat-spinner *ngIf="carregando" diameter="20"></mat-spinner>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
